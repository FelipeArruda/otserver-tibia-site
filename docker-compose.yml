services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.linux
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      DJANGO_PORT: "8000"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DB_ENGINE: ${DJANGO_DB_ENGINE:-django.db.backends.sqlite3}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-/data/db.sqlite3}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_HEALTH_CHECK_INTERVAL_SECONDS: ${CELERY_HEALTH_CHECK_INTERVAL_SECONDS:-60}
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.linux
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DB_ENGINE: ${DJANGO_DB_ENGINE:-django.db.backends.sqlite3}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-/data/db.sqlite3}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_HEALTH_CHECK_INTERVAL_SECONDS: ${CELERY_HEALTH_CHECK_INTERVAL_SECONDS:-60}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - app_data:/data
    entrypoint: []
    command:
      [
        "celery",
        "-A",
        "core",
        "worker",
        "--loglevel=info",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}",
      ]

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.linux
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DB_ENGINE: ${DJANGO_DB_ENGINE:-django.db.backends.sqlite3}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-/data/db.sqlite3}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_HEALTH_CHECK_INTERVAL_SECONDS: ${CELERY_HEALTH_CHECK_INTERVAL_SECONDS:-60}
    entrypoint: []
    command:
      [
        "celery",
        "-A",
        "core",
        "beat",
        "--loglevel=info",
        "--pidfile=",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    volumes:
      - celery_beat_data:/tmp

volumes:
  redis_data:
  celery_beat_data:
  app_data:
