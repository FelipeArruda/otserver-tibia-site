name: Docker Build Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      IMAGE_NAME: otserver-tibia-site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Docker daemon
        shell: powershell
        run: |
          Start-Service docker
          $attempts = 0
          do {
            $attempts++
            Start-Sleep -Seconds 2
            docker version *> $null
          } until ($LASTEXITCODE -eq 0 -or $attempts -ge 15)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker daemon did not become ready on windows-2022."
            exit 1
          }
          docker version

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Windows image
        shell: pwsh
        run: |
          docker build -f Dockerfile.windows -t "${{ env.IMAGE_NAME }}:windows-${{ github.sha }}" .

      - name: Push Windows image
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          docker tag "${{ env.IMAGE_NAME }}:windows-${{ github.sha }}" "${{ secrets.DOCKERHUB_USERNAME }}/otserver-tibia-site:windows-${{ github.sha }}"
          docker tag "${{ env.IMAGE_NAME }}:windows-${{ github.sha }}" "${{ secrets.DOCKERHUB_USERNAME }}/otserver-tibia-site:latest-windows"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/otserver-tibia-site:windows-${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/otserver-tibia-site:latest-windows"
