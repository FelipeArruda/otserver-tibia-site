name: Docker Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Windows image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: windows/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/otserver-tibia-site:windows-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/otserver-tibia-site:latest-windows
