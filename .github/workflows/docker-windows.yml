name: Docker Build Windows

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      IMAGE_NAME: otserver-tibia-site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Docker daemon
        shell: powershell
        run: |
          Start-Service docker
          $attempts = 0
          do {
            $attempts++
            Start-Sleep -Seconds 2
            docker version *> $null
          } until ($LASTEXITCODE -eq 0 -or $attempts -ge 15)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker daemon did not become ready on windows-2022."
            exit 1
          }
          docker version

      - name: Build Windows image for validation
        shell: pwsh
        run: |
          docker build -f Dockerfile.windows -t "${{ env.IMAGE_NAME }}:windows-${{ github.sha }}" .
